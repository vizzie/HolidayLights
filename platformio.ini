; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:yun]
platform = atmelavr
board = yun
framework = arduino
; The real firmware entry point is main.cpp; sim_main.cpp is the desktop
; simulator's entry point (see [env:native]) and must not be built here.
build_src_filter = +<*> -<sim_main.cpp>
; PlatformIO has no built-in network upload for the Yun (avrdude has no OTA
; transport for AVR). This drives the upload through the Yun's own Linux side
; over SSH instead, via tools/upload_over_ssh.sh, using the same
; merge-sketch-with-bootloader.lua + run-avrdude scripts Arduino IDE uses.
; Requires passwordless SSH (ssh-copy-id root@10.68.1.8) to root@10.68.1.8;
; override the host/user with YUN_HOST / YUN_USER env vars if needed.
;
; To upload over USB instead, comment these two lines out and set
; upload_port to the device, e.g. /dev/cu.usbmodem14101.
upload_protocol = custom
upload_command = tools/upload_over_ssh.sh $SOURCE

lib_deps =
    ; Pinned exact (not ^3.7.0) -- FastLED 3.9.4+ ballooned to thousands of
    ; files across platform driver trees irrelevant to AVR (ESP32/RP2040/
    ; Teensy), which makes PlatformIO's dependency scanner painfully slow
    ; and prone to hanging. 3.7.4 predates that growth and has everything
    ; we use (ColorFromPalette, TProgmemRGBPalette16, fadeToBlackBy, etc).
    fastled/FastLED@3.7.4
    arduino-libraries/Bridge@^1.7.0

; Desktop simulator -- runs the exact same effects.cpp/pixel_map.cpp/
; seasons.cpp on your Mac (no upload, no hardware) via sim_main.cpp, which
; opens a real SDL2 window and draws a dot per LED at its real (x,y).
; main.cpp and current_date.cpp (Bridge/Process, Yun-only) are excluded --
; sim_main.cpp fakes today's date directly instead.
; Requires SDL2 (brew install sdl2). Run with: .pio/build/native/program
[env:native]
platform = native
build_src_filter = +<*> -<main.cpp> -<current_date.cpp>
; native has no Arduino framework and no usable FastLED (its own "native"
; stub platform has an upstream bug as of 3.10.5 -- an undefined
; BusTraits<Bus::STUB> template specialization that fails to compile
; standalone). native_shim/ provides minimal drop-in Arduino.h/FastLED.h
; implementing just the handful of symbols actually used, so the real
; effects.cpp/pixel_map.cpp/seasons.cpp compile and run unmodified.
build_flags =
    -I native_shim
    -std=gnu++17
    -I/opt/homebrew/include/SDL2
    -L/opt/homebrew/lib
    -lSDL2
