; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:yun]
platform = atmelavr
board = yun
framework = arduino
; PlatformIO has no built-in network upload for the Yun (avrdude has no OTA
; transport for AVR). This drives the upload through the Yun's own Linux side
; over SSH instead, via tools/upload_over_ssh.sh, using the same
; merge-sketch-with-bootloader.lua + run-avrdude scripts Arduino IDE uses.
; Requires passwordless SSH (ssh-copy-id root@10.68.1.8) to root@10.68.1.8;
; override the host/user with YUN_HOST / YUN_USER env vars if needed.
;
; To upload over USB instead, comment these two lines out and set
; upload_port to the device, e.g. /dev/cu.usbmodem14101.
upload_protocol = custom
upload_command = tools/upload_over_ssh.sh $SOURCE

lib_deps =
    ; Pinned exact (not ^3.7.0) -- FastLED 3.9.4+ ballooned to thousands of
    ; files across platform driver trees irrelevant to AVR (ESP32/RP2040/
    ; Teensy), which makes PlatformIO's dependency scanner painfully slow
    ; and prone to hanging. 3.7.4 predates that growth and has everything
    ; we use (ColorFromPalette, TProgmemRGBPalette16, fadeToBlackBy, etc).
    fastled/FastLED@3.7.4
    arduino-libraries/Bridge@^1.7.0
